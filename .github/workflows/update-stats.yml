
name: Update GitHub Stats


on:
  push:
    branches:
      - update-stats
    paths:
      - '.github/workflows/update-stats.yml'
      - 'README.md'
# on:
#   schedule:
#     - cron: "17 0 * * *"
#   workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: "username=simple-tech-with-tarun&show_icons=true&hide_border=true&include_all_commits=true&hide=stars&hide_rank=true&bg_color=ffffff&title_color=2f80ed&text_color=434d58&icon_color=4c71f2&show=reviews,prs_merged,prs_merged_percentage&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub stats card"
            git push
          else
            echo "Stats card has not changed."
          fi
